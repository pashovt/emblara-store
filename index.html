<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMBLARA — Branded Clothing Store (Demo)</title>
    <meta name="description" content="Concept store demo: embroidered and printed polos, tees, hoodies and sweatshirts for UK businesses and teams, with a proof before production." />
    <meta name="theme-color" content="#0d1526" />
    <!-- Demo build: keep out of search engines. Review before a real launch. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Light and dark are both supported, so the browser must not force-darken the page. -->
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/garments/heavy-cotton-tee/navy-model-front.webp" />
    <script>
      // Apply the saved theme before first paint (no flash). "System" = no attribute.
      try {
        var t = localStorage.getItem('emblara-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
